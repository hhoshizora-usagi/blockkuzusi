<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ブロック崩し - 全10ステージ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden}
canvas{display:block;background:#16213e;border:2px solid #0f3460;border-radius:8px;touch-action:none}
#info{display:flex;gap:20px;padding:8px;font-size:14px}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);z-index:20}
#overlay.hidden{display:none}
#overlay h1{font-size:28px;margin-bottom:10px}
#overlay p{font-size:16px;margin-bottom:5px}
#overlay .sub{font-size:13px;color:#aaa;margin-bottom:20px}
#overlay button{padding:12px 36px;font-size:18px;border:none;border-radius:25px;background:linear-gradient(135deg,#e94560,#0f3460);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="info">
  <span id="sc">Score: 0</span>
  <span id="st">Stage: 1</span>
  <span id="lf">♥♥♥</span>
  <span id="hi">HI: 0</span>
</div>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>🧱 ブロック崩し</h1>
  <p>⭐ 星ブロックを壊してボール追加！</p>
  <p class="sub">全10ステージクリアを目指せ！</p>
  <button id="btn">スタート</button>
</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d');
var W=480,H=640;c.width=W;c.height=H;
var score=0,lives=3,state='idle',stage=1;
var hisc=parseInt(localStorage.getItem('bkHi3')||'0');
var COLS=8,ROWS=5,MAX_STAGE=10;
var baseColors=['#e94560','#f5a623','#f7dc6f','#2ecc71','#3498db'];
var blocks=[],balls=[],parts=[],pups=[];
var pad={x:200,y:600,w:80,h:12};
var inX=W/2;
var wT=0,s2T=0,slT=0,spd=4;
var MAX_BALLS=5;

function fillRR(ctx,rx,ry,rw,rh,rad){
  if(typeof ctx.roundRect==='function'){
    ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,rad);ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(rx+rad,ry);
    ctx.lineTo(rx+rw-rad,ry);
    ctx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+rad);
    ctx.lineTo(rx+rw,ry+rh-rad);
    ctx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-rad,ry+rh);
    ctx.lineTo(rx+rad,ry+rh);
    ctx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-rad);
    ctx.lineTo(rx,ry+rad);
    ctx.quadraticCurveTo(rx,ry,rx+rad,ry);
    ctx.closePath();ctx.fill();
  }
}

function stageRows(){return Math.min(ROWS+Math.floor((stage-1)*0.5),8)}
function stageSpd(){return 4+stage*0.3}
function starCount(){return Math.min(8+stage,15)}

function mkB(){
  blocks=[];var rows=stageRows();var bw=(W-20)/COLS,bh=22,hid=[];
  var total=COLS*rows;
  var sc=starCount();
  while(hid.length<sc){var i=Math.floor(Math.random()*total);if(hid.indexOf(i)===-1)hid.push(i)}
  for(var r=0;r<rows;r++)for(var cc=0;cc<COLS;cc++){
    var idx=r*COLS+cc;
    blocks.push({x:10+cc*bw,y:40+r*(bh+4),w:bw-4,h:bh,col:baseColors[r%baseColors.length],alive:true,pts:(rows-r)*10,
      hid:hid.indexOf(idx)!==-1,sh:0});
  }
}

function addB(bx,by,dx,dy){
  if(balls.length>=MAX_BALLS)return;
  var s=slT>0?spd*0.6:spd,l=Math.sqrt(dx*dx+dy*dy)||1;
  balls.push({x:bx,y:by,dx:dx/l*s,dy:dy/l*s,r:6});
}

function startStage(){
  spd=stageSpd();
  wT=0;s2T=0;slT=0;
  balls=[];pups=[];parts=[];pad.w=80;pad.x=W/2-40;
  mkB();addB(W/2,pad.y-10,0.5,-1);state='play';
}

function resetGame(){
  score=0;lives=3;stage=1;
  startStage();
}

c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();inX=(e.clientX-r.left)*(W/r.width)});
c.addEventListener('touchmove',function(e){e.preventDefault();var r=c.getBoundingClientRect();inX=(e.touches[0].clientX-r.left)*(W/r.width)},{passive:false});
c.addEventListener('touchstart',function(e){e.preventDefault();var r=c.getBoundingClientRect();inX=(e.touches[0].clientX-r.left)*(W/r.width)},{passive:false});

function spark(sx,sy,sc,n){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=1+Math.random()*3;
    parts.push({x:sx,y:sy,dx:Math.cos(a)*sp,dy:Math.sin(a)*sp,life:30+Math.random()*20,c:sc,sz:2+Math.random()*3});}
}

function applyPU(t){
  if(t==='multi'){
    var b=balls[0]||{x:pad.x+pad.w/2,y:pad.y-10};
    var angles=[-0.8,-0.4,0.4,0.8];
    for(var i=0;i<angles.length;i++){
      if(balls.length>=MAX_BALLS)break;
      addB(b.x,b.y,angles[i],-1);
    }
  }
  else if(t==='wide'){pad.w=120;wT=600}
  else if(t==='x2'){s2T=600}
  else if(t==='slow'){slT=600;for(var i=0;i<balls.length;i++){balls[i].dx*=0.6;balls[i].dy*=0.6}}
}

function update(){
  if(state!=='play')return;
  var tx=Math.max(0,Math.min(W-pad.w,inX-pad.w/2));pad.x+=(tx-pad.x)*0.25;
  if(wT>0){wT--;if(wT<=0)pad.w=80}
  if(s2T>0)s2T--;
  if(slT>0){slT--;if(slT<=0){for(var i=0;i<balls.length;i++){var bl2=balls[i];var l2=Math.sqrt(bl2.dx*bl2.dx+bl2.dy*bl2.dy)||1;bl2.dx=bl2.dx/l2*spd;bl2.dy=bl2.dy/l2*spd}}}
  for(var bi=balls.length-1;bi>=0;bi--){
    var b=balls[bi];b.x+=b.dx;b.y+=b.dy;
    if(b.x-b.r<0){b.x=b.r;b.dx=Math.abs(b.dx)}
    if(b.x+b.r>W){b.x=W-b.r;b.dx=-Math.abs(b.dx)}
    if(b.y-b.r<0){b.y=b.r;b.dy=Math.abs(b.dy)}
    if(b.dy>0&&b.y+b.r>=pad.y&&b.y+b.r<=pad.y+pad.h&&b.x>=pad.x&&b.x<=pad.x+pad.w){
      b.dy=-Math.abs(b.dy);var hit=(b.x-pad.x)/pad.w-0.5;b.dx=hit*spd*1.5;
      var l=Math.sqrt(b.dx*b.dx+b.dy*b.dy);var ss=slT>0?spd*0.6:spd;
      b.dx=b.dx/l*ss;b.dy=b.dy/l*ss;spark(b.x,pad.y,'#00e5ff',5);
    }
    if(b.y-b.r>H){balls.splice(bi,1);if(balls.length===0){lives--;if(lives<=0){state='over';showOL()}else{addB(W/2,pad.y-10,0.5,-1)}}continue}
    for(var j=0;j<blocks.length;j++){
      var bl=blocks[j];if(!bl.alive)continue;
      if(b.x+b.r>bl.x&&b.x-b.r<bl.x+bl.w&&b.y+b.r>bl.y&&b.y-b.r<bl.y+bl.h){
        bl.alive=false;score+=s2T>0?bl.pts*2:bl.pts;
        spark(bl.x+bl.w/2,bl.y+bl.h/2,bl.col,10);
        if(bl.hid){pups.push({x:bl.x+bl.w/2,y:bl.y+bl.h/2,t:'multi',dy:2});spark(bl.x+bl.w/2,bl.y+bl.h/2,'#ffd700',20)}
        var oL=b.x+b.r-bl.x,oR=bl.x+bl.w-(b.x-b.r),oT=b.y+b.r-bl.y,oB=bl.y+bl.h-(b.y-b.r);
        var m=Math.min(oL,oR,oT,oB);
        if(m===oT||m===oB)b.dy=-b.dy;else b.dx=-b.dx;
        break;
      }
    }
  }
  for(var pi=pups.length-1;pi>=0;pi--){
    var p=pups[pi];p.y+=p.dy;
    if(p.y>H){pups.splice(pi,1);continue}
    if(p.y+16>=pad.y&&p.x+14>=pad.x&&p.x-14<=pad.x+pad.w){applyPU(p.t);spark(p.x,p.y,'#ffd700',15);pups.splice(pi,1)}
  }
  for(var k=0;k<blocks.length;k++){if(blocks[k].alive&&blocks[k].hid)blocks[k].sh=(blocks[k].sh+0.05)%(Math.PI*2)}
  var allDead=true;
  for(var k2=0;k2<blocks.length;k2++){if(blocks[k2].alive){allDead=false;break}}
  if(allDead){
    if(stage>=MAX_STAGE){state='allclear';if(score>hisc){hisc=score;localStorage.setItem('bkHi3',hisc)}showOL()}
    else{stage++;showStageIntro()}
  }
  if(score>hisc){hisc=score;localStorage.setItem('bkHi3',hisc)}
}

function showStageIntro(){
  state='stageintro';
  var o=document.getElementById('overlay');o.className='';
  o.querySelector('h1').textContent='⭐ Stage '+stage;
  o.querySelector('p').textContent='スコア: '+score;
  o.querySelector('.sub').textContent='ボールが速くなるよ！';
  document.getElementById('btn').textContent='次のステージへ';
}

function draw(){
  x.clearRect(0,0,W,H);
  for(var i=0;i<blocks.length;i++){
    var bl=blocks[i];if(!bl.alive)continue;
    x.fillStyle=bl.col;fillRR(x,bl.x,bl.y,bl.w,bl.h,4);
    if(bl.hid){
      x.fillStyle='rgba(255,255,255,'+(0.3+Math.sin(bl.sh)*0.2)+')';fillRR(x,bl.x,bl.y,bl.w,bl.h,4);
      x.fillStyle='#ffd700';x.font='14px sans-serif';x.textAlign='center';
      x.fillText('\u2B50',bl.x+bl.w/2,bl.y+bl.h/2+5);
    }
  }
  for(var i2=0;i2<pups.length;i2++){
    var p=pups[i2];
    x.fillStyle='#ffd700';fillRR(x,p.x-14,p.y,28,16,6);
    x.fillStyle='#000';x.font='12px sans-serif';x.textAlign='center';
    x.fillText('\u2B50+',p.x,p.y+13);
  }
  for(var i3=0;i3<balls.length;i3++){
    var b=balls[i3];x.fillStyle='#fff';x.shadowColor='#00e5ff';x.shadowBlur=10;
    x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill();x.shadowBlur=0;
  }
  x.fillStyle='#e94560';fillRR(x,pad.x,pad.y,pad.w,pad.h,6);
  var iy=H-18;x.font='11px sans-serif';x.textAlign='left';
  if(wT>0){x.fillStyle='#00e5ff';x.fillText('WIDE '+Math.ceil(wT/60)+'s',10,iy);iy-=16}
  if(s2T>0){x.fillStyle='#ffd700';x.fillText('x2 SCORE '+Math.ceil(s2T/60)+'s',10,iy);iy-=16}
  if(slT>0){x.fillStyle='#76ff03';x.fillText('SLOW '+Math.ceil(slT/60)+'s',10,iy)}
  x.fillStyle='#aaa';x.font='10px sans-serif';x.textAlign='right';
  x.fillText('BALLS: '+balls.length+'/'+MAX_BALLS,W-10,H-8);
  for(var pi2=parts.length-1;pi2>=0;pi2--){
    var pt=parts[pi2];pt.x+=pt.dx;pt.y+=pt.dy;pt.life--;
    if(pt.life<=0){parts.splice(pi2,1);continue}
    var alpha=pt.life/50;x.globalAlpha=alpha;x.fillStyle=pt.c;
    x.beginPath();x.arc(pt.x,pt.y,pt.sz*alpha,0,Math.PI*2);x.fill();
  }
  x.globalAlpha=1;
  document.getElementById('sc').textContent='Score: '+score;
  document.getElementById('st').textContent='Stage: '+stage+'/'+MAX_STAGE;
  document.getElementById('lf').textContent=Array(lives+1).join('\u2665');
  document.getElementById('hi').textContent='HI: '+hisc;
}

function loop(){update();draw();requestAnimationFrame(loop)}

function showOL(){
  var o=document.getElementById('overlay');o.className='';
  if(state==='over'){o.querySelector('h1').textContent='\uD83D\uDCA5 ゲームオーバー';o.querySelector('p').textContent='スコア: '+score;o.querySelector('.sub').textContent='ステージ '+stage+' / ハイスコア: '+hisc;document.getElementById('btn').textContent='もう一回'}
  else if(state==='allclear'){o.querySelector('h1').textContent='\uD83C\uDF89 全ステージクリア！おめでとう！';o.querySelector('p').textContent='最終スコア: '+score;o.querySelector('.sub').textContent='ハイスコア: '+hisc;document.getElementById('btn').textContent='もう一回'}
}

document.getElementById('btn').addEventListener('click',function(){
  document.getElementById('overlay').className='hidden';
  if(state==='stageintro'){startStage()}
  else{resetGame()}
});
loop();
</script>
</body>
</html>
